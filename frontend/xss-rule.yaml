rules:
  - id: react-dangerously-set-inner-html
    languages:
      - javascript
      - typescript
    message: "Potential XSS: untrusted content is rendered using dangerouslySetInnerHTML."
    severity: WARNING
    patterns:
      - pattern: |
          <$TAG ... dangerouslySetInnerHTML={{ __html: $CONTENT }} ... />
      - pattern-not: |
          <$TAG ... dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} ... />
    metadata:
      category: security
      technology:
        - react
      cwe:
        - "CWE-79"


